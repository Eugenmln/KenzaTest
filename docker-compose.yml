services:
  postgres:
    image: postgres:17-alpine
    container_name: kova-postgres
    environment:
      POSTGRES_DB: kova
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - kova_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kova"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kova_postgres_data:
