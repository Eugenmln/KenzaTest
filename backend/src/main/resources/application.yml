spring:
  application:
    name: kova-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/kova}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-with-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin-patterns: ${FRONTEND_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
